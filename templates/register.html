<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>IN999 Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-yellow: #ffc921; --light-gray: #f7f8ff; --text-gray: #666; }
        body { margin: 0; background: var(--light-gray); font-family: 'Inter', sans-serif; padding-bottom: 70px; }
        
        /* Premium Header */
        .header { background: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-text { font-size: 24px; font-weight: 900; color: #2b3270; }
        .header-icons { display: flex; gap: 15px; color: var(--main-yellow); font-size: 20px; }

        /* Real Slider */
        .slider { width: 94%; margin: 10px auto; height: 170px; border-radius: 15px; overflow: hidden; position: relative; }
        .slides { display: flex; width: 400%; height: 100%; transition: 0.5s ease; }
        .slide { width: 25%; background-size: cover; background-position: center; }

        /* Categories (The Colorful Icons) */
        .category-grid { display: grid; grid-template-columns: repeat(6, 1fr); background: #fff; margin: 10px; padding: 15px 5px; border-radius: 15px; gap: 5px; }
        .cat-item { text-align: center; font-size: 11px; font-weight: bold; color: var(--text-gray); }
        .cat-icon { width: 40px; height: 40px; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 20px; color: #fff; }
        .cat-item.active .cat-icon { background: var(--main-yellow); }

        /* Game Grids (Popular/Hot Slots) */
        .section-header { padding: 10px 15px; display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; }
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 10px; margin-bottom: 20px; }
        .game-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .game-img { width: 100%; height: 110px; object-fit: cover; }
        .rtp-tag { background: var(--main-yellow); font-size: 9px; font-weight: 900; text-align: center; padding: 3px 0; }

        /* Provider Grid (JILI, PG, etc.) */
        .provider-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px; }
        .provider-card { height: 70px; border-radius: 10px; overflow: hidden; }
        .provider-card img { width: 100%; height: 100%; object-fit: cover; }

        /* Winning Ticker (Premium Style) */
        .win-ticker { background: #fff; margin: 10px; border-radius: 15px; padding: 10px; }
        .win-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .win-amt { color: #d4af37; font-weight: bold; font-size: 13px; }

        /* Bottom Menu */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eee; }
        .nav-link { text-align: center; color: #999; font-size: 11px; text-decoration: none; font-weight: 600; }
        .nav-link.active { color: var(--main-yellow); }
        .nav-link i { display: block; font-size: 22px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-text">IN999</div>
        <div class="header-icons"><i class="fas fa-download"></i><i class="fas fa-headset"></i></div>
    </div>

    <!-- Auto Slider -->
    <div class="slider">
        <div class="slides" id="mainSlider">
            <div class="slide" style="background-image: url('https://ossimg.v99999.in/in999/banner/20240321_114512_987.png')"></div>
            <div class="slide" style="background-image: url('https://ossimg.v99999.in/in999/banner/20240321_114533_543.png')"></div>
        </div>
    </div>

    <div class="category-grid">
        <div class="cat-item active"><div class="cat-icon" style="background:#ffc921"><i class="fas fa-th-large"></i></div>All</div>
        <div class="cat-item"><div class="cat-icon" style="background:#5c67f2"><i class="fas fa-dice"></i></div>Lottery</div>
        <div class="cat-item"><div class="cat-icon" style="background:#ff5c5c"><i class="fas fa-gamepad"></i></div>Original</div>
        <div class="cat-item"><div class="cat-icon" style="background:#a05cf2"><i class="fas fa-puzzle-piece"></i></div>Slots</div>
    </div>

    <div class="section-header"><span>🔥 Popular Games</span> <span style="color:#999; font-size:12px;">More ></span></div>
    <div class="game-grid">
        <div class="game-card"><img src="https://ossimg.v99999.in/in999/gameicon/JILI/1.png" class="game-img"><div class="rtp-tag">RTP 96.59%</div></div>
        <div class="game-card"><img src="https://ossimg.v99999.in/in999/gameicon/JILI/2.png" class="game-img"><div class="rtp-tag">RTP 97.51%</div></div>
        <div class="game-card"><img src="https://ossimg.v99999.in/in999/gameicon/JILI/165.png" class="game-img"><div class="rtp-tag">RTP 96.22%</div></div>
    </div>

    <div class="section-header"><span>🎰 Slots Providers</span></div>
    <div class="provider-grid">
        <div class="provider-card"><img src="https://ossimg.v99999.in/in999/vendorlogo/JILI.png"></div>
        <div class="provider-card"><img src="https://ossimg.v99999.in/in999/vendorlogo/PG.png"></div>
        <div class="provider-card"><img src="https://ossimg.v99999.in/in999/vendorlogo/EVO.png"></div>
        <div class="provider-card"><img src="https://ossimg.v99999.in/in999/vendorlogo/JDB.png"></div>
    </div>

    <div class="section-header"><span>🏆 Winning Information</span></div>
    <div class="win-ticker">
        <div class="win-row">
            <div class="user-info"><img src="https://via.placeholder.com/40" class="user-avatar">Mem***SHD</div>
            <div class="win-amt">₹94.08</div>
        </div>
        <div class="win-row">
            <div class="user-info"><img src="https://via.placeholder.com/40" class="user-avatar">Mem***VBC</div>
            <div class="win-amt">₹39.20</div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-link active"><i class="fas fa-home"></i>Home</a>
        <a href="#" class="nav-link"><i class="fas fa-gift"></i>Activity</a>
        <a href="#" class="nav-link"><i class="fas fa-bullhorn"></i>Promotion</a>
        <a href="#" class="nav-link"><i class="fas fa-user"></i>Account</a>
    </div>

    <script>
        let sIndex = 0;
        setInterval(() => {
            sIndex = (sIndex + 1) % 2;
            document.getElementById('mainSlider').style.transform = `translateX(-${sIndex * 25}%)`;
        }, 3000);
    </script>
</body>
</html>
