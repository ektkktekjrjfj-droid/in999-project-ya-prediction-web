<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>In999 Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; background: #f7f8ff; font-family: sans-serif; padding-bottom: 80px; }
        .nav-top { background: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .nav-top img { height: 28px; }
        .nav-top i { color: #ffc921; font-size: 22px; }

        .banner-box { width: 94%; margin: 12px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .banner-box img { width: 100%; display: block; }

        .notice { background: white; margin: 10px; padding: 10px; border-radius: 20px; display: flex; align-items: center; gap: 10px; font-size: 12px; }
        .notice-btn { background: #ffc921; color: white; border: none; padding: 5px 15px; border-radius: 15px; margin-left: auto; }

        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .cat-card { background: white; padding: 12px; border-radius: 10px; text-align: center; color: #333; font-size: 13px; }
        .cat-card i { display: block; font-size: 24px; color: #2b3270; margin-bottom: 5px; }
        .cat-card.active { background: #ffc921; color: white; }
        .cat-card.active i { color: white; }

        .game-section { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .game-item { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .game-item img { width: 100%; height: 130px; object-fit: cover; }
        .rtp-info { padding: 5px 10px; background: #ffc921; font-size: 11px; font-weight: bold; }

        .footer-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; }
        .footer-nav a { text-decoration: none; color: #999; text-align: center; font-size: 11px; }
        .footer-nav a.active { color: #ffc921; }
        .footer-nav i { display: block; font-size: 22px; margin-bottom: 3px; }
    </style>
</head>
<body>
    <div class="nav-top">
        <img src="https://www.in999dd.com/assets/png/logo-598d1a60.png" alt="Logo">
        <div style="display:flex; gap:15px;"><i class="fas fa-download"></i><i class="fas fa-headset"></i></div>
    </div>

    <div class="banner-box">
        <img src="https://ossimg.in999dd.com/In999/banner/Banner_20240315170322j7sq.png">
    </div>

    <div class="notice">
        <i class="fas fa-volume-up" style="color:#ffc921"></i>
        <span>Protect yourself from Scams!! Deposits are...</span>
        <button class="notice-btn">Detail</button>
    </div>

    <div class="cat-grid">
        <div class="cat-card active"><i class="fas fa-th-large"></i>All</div>
        <div class="cat-card"><i class="fas fa-dice"></i>Lottery</div>
        <div class="cat-card"><i class="fas fa-star"></i>Original</div>
        <div class="cat-card"><i class="fas fa-gamepad"></i>Slots</div>
        <div class="cat-card"><i class="fas fa-trophy"></i>Sports</div>
        <div class="cat-card"><i class="fas fa-video"></i>Casino</div>
    </div>

    <div class="game-section">
        <div class="game-item">
            <img src="https://ossimg.in999dd.com/In999/gameicon/TB_Common/aviator.png">
            <div class="rtp-info">RTP 96.59%</div>
        </div>
        <div class="game-item">
            <img src="https://ossimg.in999dd.com/In999/gameicon/TB_Common/cricket.png">
            <div class="rtp-info">RTP 97.51%</div>
        </div>
    </div>

    <div class="footer-nav">
        <a href="#" class="active"><i class="fas fa-home"></i>Home</a>
        <a href="#"><i class="fas fa-gift"></i>Activity</a>
        <a href="#" style="transform: scale(1.3); margin-top: -15px; color:#ffc921;"><i class="fas fa-plus-circle"></i></a>
        <a href="#"><i class="fas fa-bullhorn"></i>Promotion</a>
        <a href="#"><i class="fas fa-user-circle"></i>Account</a>
    </div>
</body>
</html>
