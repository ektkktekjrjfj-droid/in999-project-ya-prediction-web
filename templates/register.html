<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Register - In999</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-yellow: #ffc921; --bg-gray: #f7f8ff; }
        body { margin: 0; font-family: 'Arial', sans-serif; background: var(--bg-gray); }
        .header { background: var(--main-yellow); padding: 15px; display: flex; align-items: center; gap: 15px; color: #fff; font-weight: bold; }
        .header img { height: 30px; }
        .top-tab { background: #fff; display: flex; justify-content: center; padding: 15px; border-bottom: 2px solid var(--main-yellow); color: var(--main-yellow); font-weight: bold; }
        .form-container { padding: 20px; }
        .label { display: flex; align-items: center; gap: 8px; margin: 15px 0 8px; color: #666; font-size: 14px; }
        .label i { color: var(--main-yellow); }
        .input-group { display: flex; gap: 10px; }
        .country-code { background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #eee; display: flex; align-items: center; gap: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #eee; outline: none; background: #fff; }
        .reg-btn { width: 100%; padding: 15px; background: var(--main-yellow); color: #fff; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; margin-top: 30px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .login-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--main-yellow); color: var(--main-yellow); border-radius: 30px; margin-top: 15px; cursor: pointer; }
        .policy { font-size: 12px; color: #999; margin-top: 15px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <i class="fas fa-chevron-left"></i>
        <img src="https://www.in999dd.com/assets/png/logo-598d1a60.png" alt="Logo">
        <span style="margin-left: auto;">EN</span>
    </div>

    <div class="top-tab">
        <i class="fas fa-mobile-alt"></i> &nbsp; Register your phone
    </div>

    <div class="form-container">
        <div class="label"><i class="fas fa-phone"></i> Phone number</div>
        <div class="input-group">
            <div class="country-code">+91 <i class="fas fa-chevron-down"></i></div>
            <input type="text" id="phone" placeholder="Please enter the phone number">
        </div>

        <div class="label"><i class="fas fa-lock"></i> Set password</div>
        <input type="password" id="password" placeholder="Set password">

        <div class="label"><i class="fas fa-lock"></i> Confirm password</div>
        <input type="password" id="confirm_password" placeholder="Confirm password">

        <div class="label"><i class="fas fa-user-tag"></i> Invite code</div>
        <input type="text" id="invite_code" value="114876534174">

        <div class="policy">
            <input type="checkbox" checked> I have read and agree <span style="color:red">[Privacy Agreement]</span>
        </div>

        <button class="reg-btn" onclick="register()">Register</button>
        <button class="login-btn">I have an account <span style="font-weight:bold">Login</span></button>
    </div>

    <script>
        async function register() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const invite_code = document.getElementById('invite_code').value;

            if(!phone || !password) return alert("Please fill details");

            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone, password, invite_code})
            });
            const data = await res.json();
            alert(data.message);
        }
    </script>
</body>
</html>
