<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>In999 - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="main-box">
        <div class="top-nav">
            <i class="fas fa-chevron-left"></i>
            <span>Register</span>
        </div>

        <div class="banner">
            <h1>IN<span>999</span></h1>
            <p>Fair & Professional Gaming</p>
        </div>

        <div class="form-part">
            <div class="input-row">
                <i class="fas fa-phone-alt"></i>
                <input type="text" id="phone" placeholder="Phone Number">
            </div>
            <div class="input-row">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password">
            </div>
            <div class="input-row">
                <i class="fas fa-gift"></i>
                <input type="text" id="invite_code" placeholder="Invite Code">
            </div>

            <button onclick="doRegister()" class="main-btn">Register</button>
            <p class="login-text">Already have an account? <a href="#">Log in</a></p>
        </div>
    </div>

    <script>
        async function doRegister() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const invite_code = document.getElementById('invite_code').value;

            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone, password, invite_code})
            });
            const result = await res.json();
            alert(result.message);
        }
    </script>
</body>
</html>
