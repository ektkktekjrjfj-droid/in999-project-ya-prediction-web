<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>In999 - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; background: #f7f8ff; font-family: sans-serif; padding-bottom: 70px; }
        .nav-top { background: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #eee; }
        .nav-top img { height: 25px; }
        .nav-top i { color: #ffc921; font-size: 22px; }
        .banner { width: 94%; margin: 12px auto; border-radius: 12px; overflow: hidden; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .banner img { width: 100%; display: block; }
        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .cat { background: #fff; padding: 12px; border-radius: 10px; text-align: center; color: #333; font-size: 12px; }
        .cat i { display: block; font-size: 24px; color: #2b3270; margin-bottom: 5px; }
        .cat.active { background: #ffc921; color: #fff; }
        .cat.active i { color: #fff; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px; }
        .game-card { background: #fff; border-radius: 15px; overflow: hidden; position: relative; }
        .game-card img { width: 100%; height: 120px; object-fit: cover; }
        .rtp { background: #ffc921; padding: 4px 8px; font-size: 10px; font-weight: bold; }
        .footer { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eee; }
        .footer a { text-decoration: none; color: #999; font-size: 11px; text-align: center; }
        .footer a.active { color: #ffc921; }
        .footer i { display: block; font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="nav-top">
        <img src="https://www.in999dd.com/assets/png/logo-598d1a60.png" onerror="this.src='https://i.ibb.co/L8P8D9V/logo.png'">
        <div style="display:flex; gap:15px;"><i class="fas fa-download"></i><i class="fas fa-headset"></i></div>
    </div>
    <div class="banner">
        <img src="https://ossimg.in999dd.com/In999/banner/Banner_20240315170322j7sq.png" onerror="this.src='https://i.ibb.co/hZ7m9m8/banner.png'">
    </div>
    <div class="cat-grid">
        <div class="cat active"><i class="fas fa-th-large"></i>All</div>
        <div class="cat"><i class="fas fa-dice"></i>Lottery</div>
        <div class="cat"><i class="fas fa-gamepad"></i>Slots</div>
    </div>
    <div class="game-grid">
        <div class="game-card">
            <img src="https://ossimg.in999dd.com/In999/gameicon/TB_Common/aviator.png" onerror="this.src='https://i.ibb.co/vXq5GfK/aviator.png'">
            <div class="rtp">RTP 96.59%</div>
        </div>
        <div class="game-card">
            <img src="https://ossimg.in999dd.com/In999/gameicon/TB_Common/cricket.png" onerror="this.src='https://i.ibb.co/r7v9t9y/cricket.png'">
            <div class="rtp">RTP 97.51%</div>
        </div>
    </div>
    <div class="footer">
        <a href="#" class="active"><i class="fas fa-home"></i>Home</a>
        <a href="#"><i class="fas fa-gift"></i>Activity</a>
        <a href="#" style="color:#ffc921; transform:translateY(-10px)"><i class="fas fa-plus-circle" style="font-size:35px"></i></a>
        <a href="#"><i class="fas fa-bullhorn"></i>Promotion</a>
        <a href="#"><i class="fas fa-user"></i>Account</a>
    </div>
</body>
</html>
